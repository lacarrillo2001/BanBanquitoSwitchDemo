spring.application.name=SwitchPagos
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
# ===============================
# CARGAR VARIABLES DESDE .env
# ===============================
spring.config.import=optional:file:.env[.properties]

# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
spring.jpa.hibernate.ddl-auto=none

# Origenes permitidos para solicitudes CORS del frontend.
switch.cors.allowed-origins=${SWITCH_CORS_ALLOWED_ORIGINS:}

# Configuracion SMTP para envio de notificaciones.
spring.mail.host=${SPRING_MAIL_HOST:}
spring.mail.port=${SPRING_MAIL_PORT:1025}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:false}
spring.mail.from=${SPRING_MAIL_FROM:notificaciones@banquito.com}
# URL base del API HTTP de Mailpit para pruebas de correo.
mailpit.api.url=${MAILPIT_API_URL:http://localhost:8025/api/v1}

# URL base del Core Bancario para integracion REST.
core.base-url=${CORE_BASE_URL}
# Modo de integracion con el Core: rest o stub.
core.integration.mode=${CORE_INTEGRATION_MODE:rest}
# Codigo funcional del subtipo de pago masivo usado en el Core.
core.integration.codigo-subtipo-pago-masivo=${CORE_INTEGRATION_CODIGO_SUBTIPO_PAGO_MASIVO}
# Codigo contable de la cuenta de ingresos del servicio.
core.integration.codigo-cuenta-ingresos=${CORE_INTEGRATION_CODIGO_CUENTA_INGRESOS}
# Codigo contable de la cuenta de IVA del servicio.
core.integration.codigo-cuenta-iva=${CORE_INTEGRATION_CODIGO_CUENTA_IVA}
# Numero de cuenta destino para ingresos del servicio.
core.integration.numero-cuenta-ingresos=${CORE_INTEGRATION_NUMERO_CUENTA_INGRESOS}
# Numero de cuenta destino para IVA del servicio.
core.integration.numero-cuenta-iva=${CORE_INTEGRATION_NUMERO_CUENTA_IVA}
# Activa autenticacion simulada del Core cuando el modo la requiere.
core.integration.mock-autenticacion=${CORE_INTEGRATION_MOCK_AUTENTICACION:true}
# Activa cuenta favorita simulada del Core cuando el modo la requiere.
core.integration.mock-cuenta-favorita-pagos=${CORE_INTEGRATION_MOCK_CUENTA_FAVORITA_PAGOS:true}
# Usuario simulado para autenticacion mock del Core.
core.integration.mock-usuario-empresa=${CORE_INTEGRATION_MOCK_USUARIO_EMPRESA}
# RUC simulado de la empresa usado por el mock del Core.
core.integration.mock-ruc-empresa=${CORE_INTEGRATION_MOCK_RUC_EMPRESA}
# Cuenta favorita simulada usada por el mock del Core.
core.integration.mock-cuenta-favorita-pagos-numero=${CORE_INTEGRATION_MOCK_CUENTA_FAVORITA_PAGOS_NUMERO}
# Saldo disponible simulado para la cuenta favorita mock del Core.
core.integration.mock-cuenta-favorita-pagos-saldo-disponible=${CORE_INTEGRATION_MOCK_CUENTA_FAVORITA_PAGOS_SALDO_DISPONIBLE}

# Habilita el procesamiento automatico de lotes encolados.
switch.cola.scheduler.enabled=${SWITCH_COLA_SCHEDULER_ENABLED:true}
# Tiempo de espera entre ciclos del scheduler de cola.
switch.cola.scheduler.fixed-delay-ms=${SWITCH_COLA_SCHEDULER_FIXED_DELAY_MS:60000}
# Cantidad maxima de lotes a tomar por ciclo del scheduler.
switch.cola.max-lotes-por-ciclo=${SWITCH_COLA_MAX_LOTES_POR_CICLO:10}
# Minutos de espera antes de reintentar un lote fallido.
switch.cola.reintento-delay-minutos=${SWITCH_COLA_REINTENTO_DELAY_MINUTOS:5}

# Habilita el servidor SFTP embebido para recepcion de lotes.
switch.sftp.enabled=${SWITCH_SFTP_ENABLED:true}
# Host o interfaz de red en la que escuchara el servidor SFTP.
switch.sftp.host=${SWITCH_SFTP_HOST}
# Puerto TCP del servidor SFTP embebido.
switch.sftp.port=${SWITCH_SFTP_PORT}
# Directorio raiz donde se reciben y procesan archivos SFTP.
switch.sftp.root-directory=${SWITCH_SFTP_ROOT_DIRECTORY}
# Tiempo entre escaneos del inbox SFTP para encontrar archivos nuevos.
switch.sftp.scan-fixed-delay-ms=${SWITCH_SFTP_SCAN_FIXED_DELAY_MS:10000}
# Tiempo minimo para considerar estable un archivo antes de procesarlo.
switch.sftp.file-settle-ms=${SWITCH_SFTP_FILE_SETTLE_MS:3000}
# Si es true, la aplicacion falla al arrancar si el SFTP no inicia.
switch.sftp.fail-on-start-error=${SWITCH_SFTP_FAIL_ON_START_ERROR:false}
